[package]
name = "slurmer"
version = "0.1.0"
description = "Slurm job tracker over ssh"
authors = ["Shawon Ashraf"]
license = "MIT"
edition = "2021"

[dependencies]
gpui = "0.2.2"
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-segmentation = "1"
uuid = { version = "1", features = ["v4", "serde"] }

# Compile the Metal shaders when the app starts instead of at build time, so
# building on macOS does not need Xcode's separately downloaded Metal Toolchain.
[target.'cfg(target_os = "macos")'.dependencies]
gpui = { version = "0.2.2", features = ["runtime_shaders"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
