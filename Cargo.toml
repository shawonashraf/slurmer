[package]
name = "slurmer"
version = "0.1.0"
description = "Slurm job tracker over ssh"
authors = ["Shawon Ashraf"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "slurmer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["process", "macros", "rt-multi-thread"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
