name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_PACKAGER_VERSION: "0.11.8"

jobs:
  # Create the draft release once, up front, so the parallel build jobs
  # attach their bundles to the same release instead of racing to create
  # duplicates.
  create-release:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `slurmer ${tag}`,
              draft: true,
              prerelease: false,
            });

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            formats: app,dmg
            assets: "*.dmg"
          - platform: macos-latest
            target: x86_64-apple-darwin
            formats: app,dmg
            assets: "*.dmg"
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            formats: deb,appimage
            assets: "*.deb *.AppImage"
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            formats: nsis,wix
            assets: "*-setup.exe *.msi"
    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-xcb-dev libxcb1-dev libfontconfig1-dev libfreetype6-dev libvulkan-dev

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - run: cargo install cargo-packager --locked --version "$CARGO_PACKAGER_VERSION"

      - run: cargo build --release --target ${{ matrix.target }}

      - run: cargo packager --release --target ${{ matrix.target }} --formats ${{ matrix.formats }}

      - name: Upload bundles to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cd "target/${{ matrix.target }}/release"
          ls -l ${{ matrix.assets }}
          gh release upload "$TAG" ${{ matrix.assets }} --repo "$GITHUB_REPOSITORY" --clobber
